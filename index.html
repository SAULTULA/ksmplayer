<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Radio Player - Guitar Edition</title>
    <link href="https://fonts.googleapis.com/css2?family=Oswald:wght@500&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons/font/bootstrap-icons.css">
    <link rel="stylesheet" href="guitar.css">
</head>
<body class="guitar-stage">

    <article class="guitar-player">
        
        <!-- Cuerpo de madera de la guitarra (Sunburst) -->
        <div class="guitar-body">
            
            <!-- Logo pegado como una calcomanía en la madera -->
            <img src="./hits.png" alt="Logo" class="guitar-logo" onerror="this.style.display='none'">
            
            <div id="statusText" class="guitar-status">OFFLINE</div>
            
            <!-- Contenedor del Vúmetro Transparente 1 -->
            <div id="dragVumeter1" class="guitar-pickup-transparent" style="top: -20.68%; left: 52.36%; transform: rotate(-19deg); width: 300px; height: 96px;" data-spacing-left="12" data-spacing-right="12" data-vibr-force="0.1">
                <canvas id="vumeter1" class="pickup-vumeter"></canvas>
            </div>

            <!-- Contenedor del Vúmetro Transparente 2 -->
            <div id="dragVumeter2" class="guitar-pickup-transparent" style="top: -12.88%; left: 52.99%; transform: rotate(-19deg); width: 300px; height: 96px;" data-spacing-left="12" data-spacing-right="12" data-vibr-force="2">
                <canvas id="vumeter2" class="pickup-vumeter"></canvas>
            </div>

            <!-- Contenedor del Vúmetro Transparente 3 -->
            <div id="dragVumeter3" class="guitar-pickup-transparent" style="top: -5.6%; left: 55.45%; transform: rotate(-19deg); width: 300px; height: 96px;" data-spacing-left="12" data-spacing-right="12" data-vibr-force="2">
                <canvas id="vumeter3" class="pickup-vumeter"></canvas>
            </div>

            <!-- Botón Power -->
            <button id="playSwitch" class="absolute-power-btn" style="top: 67.81%; left: 25.46%;">
                <span class="control-label text-neon">INICIAR</span>
                <i class="bi bi-power"></i>
            </button>

            <!-- Potenciómetro interactivo sobre la perilla original de la guitarra -->
            <div id="dragVol" class="absolute-vol-knob" style="top: 80.04%; left: 36.35%;">
                <span class="control-label text-neon">VOLUMEN</span>
                <div class="pot-knob-container glow-neon">
                    <div id="volKnob" class="potentiometer-knob"></div>
                    <input type="range" id="volSlider" class="invisible-slider" min="0" max="1" step="0.01" value="0.9">
                </div>
            </div>

            <!-- Redes sociales incrustadas en el cuerpo -->
            <div id="dragSocials" class="guitar-socials" style="top: 85.07%; left: 74.36%;">
                <a href="http://www.facebook.com/tu_facebook" target="_blank" class="social-btn"><i class="bi bi-facebook"></i></a>
                <a href="http://www.twitter.com/tu_twitter" target="_blank" class="social-btn"><i class="bi bi-twitter"></i></a>
                <a href="mailto:tu_correo_electronico" class="social-btn"><i class="bi bi-envelope-fill"></i></a>
            </div>

        </div>

        <!-- Reproductor de Audio Oculto -->
    <audio id="audioElement">
        <source src="https://stream.zeno.fm/k9ksf0kn2nhvv" type="audio/mpeg">
    </audio>
    </article>

    <script src="guitar.js"></script>
</body>
</html>
